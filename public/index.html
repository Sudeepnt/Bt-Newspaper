<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efece5">
  <title>Bought. — Today's issue</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <main class="page">
    <div class="sticky-masthead">
      <header class="masthead">
      <span class="wordmark">Bought.</span>

      <div class="issue-date">
        <div class="date-copy">
          <span class="weekday">Tuesday</span>
          <time datetime="2026-10-13">October 13, 2026</time>
        </div>
      </div>

      <div class="language-picker">
        <button class="language-trigger" type="button" aria-label="Change language, English" aria-haspopup="dialog" aria-controls="language-menu" aria-expanded="false">
          <svg class="globe-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.5 2.5 3.7 5.5 3.7 9S14.5 18.5 12 21c-2.5-2.5-3.7-5.5-3.7-9S9.5 5.5 12 3Z" />
          </svg>
          <span class="language-name">English</span>
          <svg class="chevron-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="m3 6 5 5 5-5" />
          </svg>
        </button>

        <div class="language-menu" id="language-menu" role="dialog" aria-label="Choose newspaper language" hidden>
          <div class="menu-heading">Read in your language</div>
          <div class="language-options"></div>
        </div>
      </div>
      </header>

      <div class="newspaper-rules" aria-hidden="true"></div>
    </div>

    <div class="view-switch" role="group" aria-label="Issue format">
      <button class="view-option is-active" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="1.5" />
          <rect x="6.5" y="7" width="4.5" height="5" />
          <path d="M14 7h4M14 10h4M6.5 15h11.5M6.5 18h11.5" />
        </svg>
        <span>Newspaper</span>
      </button>
      <a class="view-option" href="podcast.html" aria-label="Open podcast edition">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 10v4M7 7v10M11 3v18M15 8v8M19 5v14M23 10v4" />
        </svg>
        <span>Podcast</span>
      </a>
    </div>

    <div class="story-list" id="edition-stories"></div>

    <section class="issue-completion" aria-label="Today's issue complete">
      <div class="completion-intro">
        <i class="completion-short-rule" aria-hidden="true"></i>
        <p>Today's issue</p>
        <strong>50</strong>
      </div>

      <div class="completion-grid" aria-label="Stories by category">
        <div class="completion-stat"><strong data-final-count="8">8</strong><span>Technology</span></div>
        <div class="completion-stat"><strong data-final-count="8">8</strong><span>AI</span></div>
        <div class="completion-stat"><strong data-final-count="12">12</strong><span>Tech<br>Business</span></div>
        <div class="completion-stat"><strong data-final-count="10">10</strong><span>Founders &amp;<br>Startups</span></div>
        <div class="completion-stat"><strong data-final-count="8">8</strong><span>Product<br>Launches</span></div>
        <div class="completion-stat"><strong data-final-count="4">4</strong><span>Tech<br>Geopolitics</span></div>
      </div>

      <div class="completion-message">
        <i class="completion-short-rule" aria-hidden="true"></i>
        <span class="completion-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="m6 12 4 4 8-9" /></svg>
        </span>
        <h2>You are up to date.</h2>
      </div>

      <div class="completion-mountains">
        <div class="mountain-terrain" role="img" aria-label="Layered mountain ridges with slowly drifting fog">
          <canvas id="mountain-far"></canvas>
          <canvas id="mountain-mid"></canvas>
          <canvas id="mountain-near"></canvas>
        </div>
        <div class="mountain-light" aria-hidden="true"></div>
        <div class="mountain-reveal-fog" aria-hidden="true"></div>
        <div class="fog-ribbon fog-far" aria-hidden="true"></div>
        <div class="fog-ribbon fog-mid" aria-hidden="true"></div>
        <div class="fog-ribbon fog-near" aria-hidden="true"></div>
        <div class="mountain-fade" aria-hidden="true"></div>
        <div class="completion-seal" aria-label="Daily issue complete"><i aria-hidden="true"></i><span>Daily issue complete</span><i aria-hidden="true"></i></div>
      </div>
    </section>
  </main>

  <section class="article-overlay" id="article-overlay" role="dialog" aria-modal="true" aria-labelledby="article-overlay-title" hidden>
    <div class="article-overlay-content"></div>
  </section>

  <div class="action-feedback" id="action-feedback" role="status" aria-live="polite" hidden></div>

  <script src="language.js"></script>
  <script>
    // Use the pipeline feed when it exists (prime stories with presenter video); otherwise the built-in samples.
    (async () => {
      try {
        const res = await fetch('live/feed.json', { cache: 'no-cache' });
        if (res.ok) window.liveFeed = await res.json();
      } catch (e) { /* no feed: keep the sample stories */ }
      for (const src of ['stories.js', 'completion.js']) {
        await new Promise((resolve) => {
          const el = document.createElement('script');
          el.src = src + '?v=4'; el.onload = el.onerror = resolve;
          document.body.append(el);
        });
      }
    })();
  </script>
</body>
</html>
